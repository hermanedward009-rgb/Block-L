<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block L — My Profile</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/app.js"></script>
  <script>
    function loadSocketScript() {
      return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = `${API_BASE_URL || ''}/socket.io/socket.io.js`;
        s.onload = resolve;
        s.onerror = resolve;
        document.head.appendChild(s);
      });
    }

    (async () => {
      await loadSocketScript();
      const user = await initShell('profile');
      if (!user) return;
      document.getElementById('pageTitle').textContent = 'My Profile';

      const remindersHtml = await buildRemindersHtml(user);

      document.getElementById('pageContent').innerHTML = `
        ${remindersHtml}

        <div class="grid-2">
          <div class="card">
            <h3 style="font-size:17px; margin-bottom:14px;">Profile Details & Photo</h3>
            <div id="profileAlert" class="alert" style="display:none;"></div>

            <div style="display:flex; align-items:center; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--border); margin-bottom:18px;">
              <img id="avatarPreview" src="${imgSrcAttr(user.avatar)}" alt="${htmlAttr(user.first_name)}" class="user-avatar-lg" />
              <div>
                <h4 style="font-size:17px;">${user.first_name} ${user.second_name}</h4>
                <div style="margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;">
                  <span class="badge badge-primary">${user.role === 'admin' ? 'Administrator' : 'Room ' + user.room}</span>
                  <span class="badge badge-success">${user.status}</span>
                </div>
              </div>
            </div>

            <form id="profileForm" enctype="multipart/form-data">
              <div class="grid-2" style="gap:12px;">
                <div class="form-group">
                  <label>First Name</label>
                  <input type="text" name="first_name" value="${user.first_name}" class="form-control" required />
                </div>
                <div class="form-group">
                  <label>Second Name</label>
                  <input type="text" name="second_name" value="${user.second_name}" class="form-control" required />
                </div>
              </div>
              <div class="form-group">
                <label>Phone Number (10 Digits)</label>
                <input type="text" name="phone" value="${user.phone}" maxlength="10" pattern="\\d{10}" class="form-control" required />
              </div>
              <div class="form-group">
                <label>Update Profile Photo</label>
                <input type="file" name="avatar" accept="image/*" class="form-control" />
              </div>
              <button type="submit" class="btn btn-primary">Save Profile</button>
            </form>
          </div>

          <div class="card">
            <h3 style="font-size:17px; margin-bottom:6px;">Change Password</h3>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
              Update your account password using your current phone number and room.
            </p>
            <div id="pwAlert" class="alert" style="display:none;"></div>

            <form id="changePasswordForm">
              <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPw" minlength="6" class="form-control" placeholder="At least 6 characters" required />
              </div>
              <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPw" minlength="6" class="form-control" placeholder="Repeat new password" required />
              </div>
              <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
          </div>
        </div>
      `;

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await apiFetch('/api/profile/update', { method: 'POST', body: formData });
        const data = await res.json();
        const box = document.getElementById('profileAlert');
        if (!res.ok) {
          box.className = 'alert alert-error';
          box.textContent = data.error || 'Update failed.';
          box.style.display = 'block';
          return;
        }
        if (data.avatar) {
          document.getElementById('avatarPreview').src = assetUrl(data.avatar);
          if (CURRENT_USER) CURRENT_USER.avatar = data.avatar;
        }
        box.className = 'alert alert-success';
        box.textContent = 'Profile photo and details saved.';
        box.style.display = 'block';
      });

      document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pw = document.getElementById('newPw').value;
        const confirm = document.getElementById('confirmPw').value;
        const box = document.getElementById('pwAlert');

        if (pw !== confirm) {
          box.className = 'alert alert-error';
          box.textContent = 'Passwords do not match.';
          box.style.display = 'block';
          return;
        }

        const res = await apiFetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            phone: user.phone,
            room: user.room,
            new_password: pw
          })
        });
        const data = await res.json();
        if (!res.ok) {
          box.className = 'alert alert-error';
          box.textContent = data.error || 'Could not change password.';
          box.style.display = 'block';
          return;
        }
        e.target.reset();
        box.className = 'alert alert-success';
        box.textContent = 'Password updated successfully.';
        box.style.display = 'block';
      });
    })();
  </script>
</body>
</html>
