<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Block L — My Profile</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const user = await initShell('profile');
      if (!user) return;
      document.getElementById('pageTitle').textContent = 'My Profile';

      document.getElementById('pageContent').innerHTML = `
        <div class="card" style="max-width: 560px;">
          <div id="profAlert" class="alert"></div>
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 24px;">
            <img id="previewImg" src="${user.avatar}" style="width: 88px; height: 88px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary);" />
            <div>
              <h3 style="font-size: 20px;">${user.first_name} ${user.second_name}</h3>
              <div style="margin-top: 6px;">
                <span class="badge badge-primary">${user.role === 'admin' ? 'Admin' : 'Room ' + user.room}</span>
                <span class="badge badge-success">Verified</span>
              </div>
            </div>
          </div>

          <form id="profileForm" enctype="multipart/form-data">
            <div class="form-group">
              <label>Change Profile Photo</label>
              <input type="file" name="avatar" id="avatarInput" accept="image/*" class="form-control" />
            </div>
            <div class="form-group">
              <label>First Name</label>
              <input type="text" name="first_name" value="${user.first_name}" class="form-control" required />
            </div>
            <div class="form-group">
              <label>Second Name</label>
              <input type="text" name="second_name" value="${user.second_name}" class="form-control" required />
            </div>
            <div class="form-group">
              <label>Phone Number (10 digits)</label>
              <input type="text" name="phone" value="${user.phone}" maxlength="10" pattern="\\d{10}" class="form-control" required />
            </div>
            <div class="form-group">
              <label>Assigned Room</label>
              <input type="text" value="${user.room}" class="form-control" disabled />
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      `;

      document.getElementById('avatarInput').addEventListener('change', (e) => {
        if (e.target.files[0]) {
          document.getElementById('previewImg').src = URL.createObjectURL(e.target.files[0]);
        }
      });

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await fetch('/api/profile/update', { method: 'POST', body: formData });
        const data = await res.json();
        const alertBox = document.getElementById('profAlert');
        if (!res.ok) {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = data.error;
          alertBox.style.display = 'block';
          return;
        }
        location.reload();
      });
    })();
  </script>
</body>
</html>
