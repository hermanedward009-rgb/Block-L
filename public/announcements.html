<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block L — Announcements & Advice</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/app.js"></script>
  <script>
    function loadSocketScript() {
      return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = `${API_BASE_URL || ''}/socket.io/socket.io.js`;
        s.onload = resolve;
        s.onerror = resolve;
        document.head.appendChild(s);
      });
    }

    (async () => {
      await loadSocketScript();
      const user = await initShell('announcements');
      if (!user) return;
      CURRENT_PAGE_USER = user;
      document.getElementById('pageTitle').textContent = 'Announcements & Community Advice';

      document.getElementById('pageContent').innerHTML = `
        <div class="card" style="margin-bottom:24px; max-width:720px;">
          <h3 style="font-size:17px; margin-bottom:12px;">Create a Post</h3>
          <div id="postAlert" class="alert" style="display:none;"></div>
          <form id="postForm">
            <div class="form-group">
              <label>Category</label>
              <select id="postType" class="form-control">
                ${user.role === 'admin' ? '<option value="announcement">Official Admin Announcement</option>' : ''}
                <option value="advice">Community Advice / Suggestion</option>
              </select>
            </div>
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="postTitle" class="form-control" required />
            </div>
            <div class="form-group">
              <label>Message</label>
              <textarea id="postBody" rows="3" class="form-control" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Publish Post</button>
          </form>
        </div>

        <div class="grid-2">
          <div>
            <h3 style="font-size:16px; margin-bottom:12px;">Official Announcements</h3>
            <div id="announcementsFeed" style="display:flex; flex-direction:column; gap:12px;"></div>
          </div>
          <div>
            <h3 style="font-size:16px; margin-bottom:12px;">Community Advice Board</h3>
            <div id="adviceFeed" style="display:flex; flex-direction:column; gap:12px;"></div>
          </div>
        </div>
      `;

      document.getElementById('postForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await apiFetch('/api/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: document.getElementById('postType').value,
            title: document.getElementById('postTitle').value,
            body: document.getElementById('postBody').value
          })
        });
        const data = await res.json();
        const box = document.getElementById('postAlert');
        if (!res.ok) {
          box.className = 'alert alert-error';
          box.textContent = data.error || 'Could not publish post.';
          box.style.display = 'block';
          return;
        }
        e.target.reset();
        box.className = 'alert alert-success';
        box.textContent = 'Published successfully.';
        box.style.display = 'block';
        await loadPosts();
      });

      await loadPosts();
    })();

    let CURRENT_PAGE_USER = null;

    async function loadPosts() {
      const res = await apiFetch('/api/posts');
      if (!res.ok) return;
      const posts = await res.json();

      const announcements = posts.filter(p => p.type === 'announcement');
      const advice = posts.filter(p => p.type === 'advice');

      const adminActions = (p) => CURRENT_PAGE_USER?.role === 'admin' ? `
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button type="button" class="btn btn-outline" style="font-size:12px; padding:6px 10px;" onclick="editPost(${p.id})">Edit</button>
          <button type="button" class="btn btn-danger" style="font-size:12px; padding:6px 10px;" onclick="deletePost(${p.id})">Delete</button>
        </div>
      ` : '';

      const renderCard = (p) => `
        <div class="card">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
            <img src="${assetUrl(p.avatar)}" class="user-avatar-sm" alt="${p.first_name}" />
            <div>
              <strong style="font-size:14px;">${p.title}</strong>
              <div style="font-size:12px; color:var(--text-muted);">${p.first_name} ${p.second_name} (${p.room || 'ADMIN'})</div>
            </div>
          </div>
          <p style="font-size:14px; color:var(--text-main); white-space:pre-line;">${p.body}</p>
          ${adminActions(p)}
        </div>
      `;

      document.getElementById('announcementsFeed').innerHTML = announcements.length
        ? announcements.map(renderCard).join('')
        : '<div class="card" style="color:var(--text-muted); font-size:13px;">No announcements yet.</div>';

      document.getElementById('adviceFeed').innerHTML = advice.length
        ? advice.map(renderCard).join('')
        : '<div class="card" style="color:var(--text-muted); font-size:13px;">No advice posts yet.</div>';
    }

    async function deletePost(id) {
      if (!confirm('Delete this post permanently?')) return;
      const res = await apiFetch(`/api/admin/posts/${id}`, { method: 'DELETE' });
      if (!res.ok) return alert('Delete failed.');
      await loadPosts();
    }

    async function editPost(id) {
      const newTitle = prompt('New title:');
      if (newTitle === null) return;
      const newBody = prompt('New message:');
      if (newBody === null) return;
      const newType = prompt('Type (announcement or advice):', 'announcement');
      if (newType === null) return;
      const res = await apiFetch(`/api/admin/posts/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle.trim(), body: newBody.trim(), type: newType.trim() })
      });
      if (!res.ok) return alert('Update failed.');
      await loadPosts();
    }
  </script>
</body>
</html>
