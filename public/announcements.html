<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Block L — Announcements & Advice</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/app.js"></script>
  <script>
    (async () => {
      const user = await initShell('announcements');
      if (!user) return;
      document.getElementById('pageTitle').textContent = 'Announcements & Resident Advice';

      const res = await fetch('/api/posts');
      const posts = await res.json();
      const announcements = posts.filter(p => p.type === 'announcement');
      const advices = posts.filter(p => p.type === 'advice');

      document.getElementById('pageContent').innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <!-- Official Admin Announcements -->
          <div>
            <h3 style="margin-bottom: 14px;">Official Announcements</h3>
            ${user.role === 'admin' ? `
              <div class="card" style="margin-bottom: 18px;">
                <form onsubmit="submitPost(event, 'announcement')">
                  <div class="form-group">
                    <label>Announcement Title</label>
                    <input type="text" id="annTitle" class="form-control" required />
                  </div>
                  <div class="form-group">
                    <label>Message</label>
                    <textarea id="annBody" rows="3" class="form-control" required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Publish Announcement</button>
                </form>
              </div>
            ` : ''}
            ${announcements.map(a => `
              <div class="card" style="margin-bottom: 14px; border-left: 4px solid var(--primary);">
                <div style="font-weight: 700; font-size: 16px;">${a.title}</div>
                <p style="margin: 8px 0; font-size: 14px; color: var(--text-main);">${a.body}</p>
                <div style="font-size: 12px; color: var(--text-muted);">Posted by Admin • ${a.created_at}</div>
              </div>
            `).join('') || '<p style="color:var(--text-muted);">No announcements yet.</p>'}
          </div>

          <!-- Community Advice (Open to Everyone) -->
          <div>
            <h3 style="margin-bottom: 14px;">Resident Advice & Suggestions</h3>
            <div class="card" style="margin-bottom: 18px;">
              <form onsubmit="submitPost(event, 'advice')">
                <div class="form-group">
                  <label>Advice Topic</label>
                  <input type="text" id="advTitle" class="form-control" required />
                </div>
                <div class="form-group">
                  <label>Your Advice</label>
                  <textarea id="advBody" rows="3" class="form-control" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Share Advice</button>
              </form>
            </div>
            ${advices.map(ad => `
              <div class="card" style="margin-bottom: 14px;">
                <div style="font-weight: 700; font-size: 15px;">${ad.title}</div>
                <p style="margin: 8px 0; font-size: 14px;">${ad.body}</p>
                <div style="font-size: 12px; color: var(--text-muted);">By ${ad.first_name} ${ad.second_name} (${ad.room})</div>
              </div>
            `).join('') || '<p style="color:var(--text-muted);">No advice shared yet.</p>'}
          </div>
        </div>
      `;
    })();

    async function submitPost(e, type) {
      e.preventDefault();
      const title = document.getElementById(type === 'announcement' ? 'annTitle' : 'advTitle').value;
      const body = document.getElementById(type === 'announcement' ? 'annBody' : 'advBody').value;
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, title, body })
      });
      if (res.ok) location.reload();
    }
  </script>
</body>
</html>
