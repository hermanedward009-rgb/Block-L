<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block L — Sign In</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-badge">L</div>
        <div>
          <h1 style="font-size: 20px; font-weight: 800; line-height: 1.2;">Block L Residence</h1>
          <p style="font-size: 13px; color: var(--text-muted);">Rooms R-01 to R-10 Portal</p>
        </div>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button type="button" id="tabRegister" class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>

      <div id="authMsg" class="alert" style="display:none;"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="form-group">
          <label>Phone Number or Admin Username</label>
          <input type="text" id="loginIdentifier" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:4px;">Sign In</button>
        <div style="text-align:center; margin-top:14px;">
          <button type="button" onclick="switchAuthTab('forgot')" style="background:none; border:none; color:var(--primary); font-size:13px; font-weight:600; cursor:pointer;">
            Forgot password?
          </button>
        </div>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" enctype="multipart/form-data" style="display:none;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" name="first_name" class="form-control" required />
          </div>
          <div class="form-group">
            <label>Second Name</label>
            <input type="text" name="second_name" class="form-control" required />
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number (10 Digits)</label>
          <input type="text" name="phone" maxlength="10" pattern="\d{10}" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Select Room (Max 2 Residents)</label>
          <select name="room" id="regRoomSelect" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>Profile Photo (Required)</label>
          <input type="file" name="avatar" accept="image/*" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Create Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">New accounts stay pending until the Administrator approves you on the dashboard.</p>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Registration</button>
      </form>

      <!-- FORGOT PASSWORD FORM -->
      <form id="forgotForm" style="display:none;">
        <div class="form-group">
          <label>Registered Phone Number</label>
          <input type="text" id="fpPhone" maxlength="10" class="form-control" required />
        </div>
        <div class="form-group">
          <label>Room Number (e.g. R-01)</label>
          <input type="text" id="fpRoom" class="form-control" required />
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="fpPassword" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Reset Password</button>
        <div style="text-align:center; margin-top:14px;">
          <button type="button" onclick="switchAuthTab('login')" style="background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer;">
            Back to Sign In
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function showAuthAlert(text, type) {
      const box = document.getElementById('authMsg');
      box.className = `alert ${type === 'error' ? 'alert-error' : 'alert-success'}`;
      box.textContent = text;
      box.style.display = 'block';
    }

    function switchAuthTab(tab) {
      document.getElementById('authMsg').style.display = 'none';
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('forgotForm').style.display = tab === 'forgot' ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      if (tab === 'register') loadRoomAvailability();
    }

    async function loadRoomAvailability() {
      const res = await apiFetch('/api/rooms-availability');
      if (!res.ok) return;
      const rooms = await res.json();
      const select = document.getElementById('regRoomSelect');
      select.innerHTML = rooms.map(r => `
        <option value="${r.room}" ${r.full ? 'disabled' : ''}>
          ${r.room} (${r.count}/2 occupied)${r.full ? ' — Full' : ''}
        </option>
      `).join('');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await apiFetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          identifier: document.getElementById('loginIdentifier').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) return showAuthAlert(data.error || 'Login failed.', 'error');
      window.location.href = '/dashboard.html';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await apiFetch('/api/register', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) return showAuthAlert(data.error || 'Registration failed.', 'error');
      e.target.reset();
      switchAuthTab('login');
      showAuthAlert(data.message, 'success');
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await apiFetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone: document.getElementById('fpPhone').value,
          room: document.getElementById('fpRoom').value,
          new_password: document.getElementById('fpPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) return showAuthAlert(data.error || 'Reset failed.', 'error');
      switchAuthTab('login');
      showAuthAlert(data.message, 'success');
    });
  </script>
</body>
</html>
