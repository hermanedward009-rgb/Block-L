<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block L — Residents & Chat</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let activePeer = 'group';
    let me = null;

    (async () => {
      me = await initShell('chat');
      if (!me) return;
      document.getElementById('pageTitle').textContent = 'Block L Residents & Chat';

      const res = await fetch('/api/members');
      const members = await res.json();

      document.getElementById('pageContent').innerHTML = `
        <div class="chat-layout">
          <div class="card chat-sidebar-card" style="overflow-y: auto; padding: 14px;">
            <div style="font-weight: 700; font-size: 12px; color: var(--text-muted); margin-bottom: 10px;">CONVERSATIONS</div>
            <div onclick="selectChat('group', 'Block L Group Chat')" class="nav-item active" id="peer-group" style="cursor: pointer; margin-bottom: 8px;">
              🏢 Block L Group Chat
            </div>
            <div style="font-weight: 700; font-size: 12px; color: var(--text-muted); margin: 14px 0 8px;">MEMBERS & ADMIN</div>
            ${members.filter(m => m.id !== me.id).map(m => `
              <div onclick="selectChat(${m.id}, '${m.first_name} ${m.second_name} (${m.room})')" id="peer-${m.id}" class="nav-item" style="cursor: pointer;">
                <img src="${m.avatar}" class="user-avatar-sm" />
                <div>
                  <div style="font-weight: 600; font-size: 13px;">${m.first_name} ${m.second_name}</div>
                  <div style="font-size: 11px;">${m.role === 'admin' ? 'Admin' : m.room}</div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="card chat-window-card" style="display: flex; flex-direction: column; justify-content: space-between; padding: 0;">
            <div style="padding: 15px 20px; border-bottom: 1px solid var(--border); font-weight: 700;" id="chatHeader">
              Block L Group Chat
            </div>
            <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;"></div>
            <form id="chatForm" enctype="multipart/form-data" style="padding: 12px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center;">
              <label class="btn btn-outline" style="padding: 10px 12px; cursor: pointer;" title="Share Photo or File">
                📎
                <input type="file" id="mediaInput" name="media" accept="image/*,.pdf,.doc,.docx" style="display: none;" />
              </label>
              <input type="text" id="chatInput" class="form-control" placeholder="Type a message..." />
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>
      `;

      loadMessages();

      if (SOCKET_CLIENT) {
        SOCKET_CLIENT.on('chat:message', (msg) => {
          const isGroupMsg = activePeer === 'group' && !msg.receiver_id;
          const isDirectMsg = activePeer !== 'group' && (
            (msg.sender_id === Number(activePeer) && msg.receiver_id === me.id) ||
            (msg.sender_id === me.id && msg.receiver_id === Number(activePeer))
          );
          if (isGroupMsg || isDirectMsg) {
            appendMessage(msg);
          }
        });
      }

      document.getElementById('chatForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('chatInput');
        const fileInput = document.getElementById('mediaInput');
        if (!input.value.trim() && !fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('receiver_id', activePeer);
        formData.append('content', input.value.trim());
        if (fileInput.files[0]) {
          formData.append('media', fileInput.files[0]);
        }

        const res = await fetch('/api/messages', { method: 'POST', body: formData });
        if (res.ok) {
          input.value = '';
          fileInput.value = '';
        }
      });
    })();

    function selectChat(peerId, title) {
      activePeer = peerId;
      document.getElementById('chatHeader').textContent = title;
      document.querySelectorAll('[id^="peer-"]').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`peer-${peerId}`);
      if (activeEl) activeEl.classList.add('active');
      loadMessages();
    }

    function renderMedia(url) {
      if (!url) return '';
      const isImage = /\.(png|jpe?g|gif|webp)$/i.test(url);
      if (isImage) {
        return `<img src="${url}" alt="Shared media" class="chat-media-img" />`;
      }
      return `<a href="${url}" target="_blank" class="chat-media-file">📄 Download Attachment</a>`;
    }

    function appendMessage(m) {
      const box = document.getElementById('chatMessages');
      if (!box) return;
      const isMe = m.sender_id === me.id;
      const wrap = document.createElement('div');
      wrap.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
      wrap.style.maxWidth = '75%';
      wrap.innerHTML = `
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 3px; text-align: ${isMe ? 'right' : 'left'};">
          ${m.first_name} (${m.room})
        </div>
        <div style="padding: 10px 14px; border-radius: 12px; font-size: 14px; word-break: break-word;
          background: ${isMe ? 'var(--primary)' : 'var(--bg-subtle)'};
          color: ${isMe ? '#ffffff' : 'var(--text-main)'};
          border: 1px solid ${isMe ? 'var(--primary)' : 'var(--border)'};">
          ${m.content ? `<div>${m.content}</div>` : ''}
          ${renderMedia(m.media_url)}
        </div>
      `;
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    async function loadMessages() {
      const res = await fetch(`/api/messages?peerId=${activePeer}`);
      const msgs = await res.json();
      const box = document.getElementById('chatMessages');
      if (!box) return;
      box.innerHTML = '';
      msgs.forEach(appendMessage);
    }
  </script>
</body>
</html>
