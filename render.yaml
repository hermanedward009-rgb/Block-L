services:
  - type: web
    name: block-l
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATA_DIR
        value: /var/data/block-l
      - key: NODE_ENV
        value: production
    disk:
      name: block-l-data
      mountPath: /var/data
      sizeGB: 1